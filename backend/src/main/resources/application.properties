# Default DataSource configuration – MySQL (dev only)
spring.datasource.url=jdbc:mysql://localhost:3306/iotids?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=iotids_user
spring.datasource.password=secret
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Server
server.port=8080

# Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.iotids=DEBUG

# WebSocket path (SockJS fallback)
spring.websocket.path=/ws
