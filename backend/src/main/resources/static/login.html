<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SentinelAI — Login Portal</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/dashboard.css" />
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: var(--bg-main);
            position: relative;
        }
        /* Vision UI background accents */
        body::before {
            content: ''; position: absolute; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(0, 117, 255, 0.4) 0%, transparent 60%);
            top: -150px; left: -150px; border-radius: 50%; pointer-events: none; opacity: 0.5;
        }
        body::after {
            content: ''; position: absolute; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.3) 0%, transparent 60%);
            bottom: -200px; right: -200px; border-radius: 50%; pointer-events: none; opacity: 0.5;
        }
        .login-card {
            width: 100%; max-width: 400px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            z-index: 10;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            text-align: center;
        }
        .brand-header { margin-bottom: 30px; }
        .logo-box {
            width: 60px; height: 60px; background: #fff; border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; color: #000; margin: 0 auto 15px auto;
        }
        .login-card h2 { font-size: 24px; font-weight: 700; margin-bottom: 5px; }
        .login-card p { font-size: 14px; color: var(--text-muted); margin-bottom: 30px; }
        
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 8px; }
        .input-wrapper {
            background: #0f1525; border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 14px 15px; display: flex; align-items: center; gap: 12px;
            transition: 0.3s;
        }
        .input-wrapper:focus-within { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(0, 117, 255, 0.2); }
        .input-wrapper i { color: var(--text-muted); }
        .input-wrapper input {
            background: transparent; border: none; color: #fff; outline: none;
            font-size: 14px; font-family: var(--font-family); width: 100%;
        }
        
        .btn-login {
            background: var(--primary); color: #fff; font-family: var(--font-family);
            font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
            width: 100%; padding: 15px; border: none; border-radius: 12px;
            cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-login:hover { background: #0062d6; transform: translateY(-2px); }
        
        .error-msg {
            background: rgba(238, 49, 88, 0.1); border: 1px solid var(--danger);
            color: var(--danger); font-size: 13px; font-weight: 600;
            padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none;
        }
        .logout-msg {
            background: rgba(1, 181, 116, 0.1); border: 1px solid var(--success);
            color: var(--success); font-size: 13px; font-weight: 600;
            padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-header">
            <div class="logo-box"><i class="fa-solid fa-shield-halved"></i></div>
            <h2>Welcome Back</h2>
            <p>Enter your credentials to access the SOC</p>
        </div>
        
        <div class="error-msg" id="error-msg"><i class="fa-solid fa-circle-exclamation"></i> Invalid username or password.</div>
        <div class="logout-msg" id="logout-msg"><i class="fa-solid fa-circle-check"></i> You have been successfully logged out.</div>
        
        <form action="/perform_login" method="POST">
            <div class="input-group">
                <label>Username</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" name="username" placeholder="Admin username" required>
                </div>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
            </div>
            
            <button type="submit" class="btn-login">Sign In</button>
        </form>
    </div>

    <script>
        // Check URL parameters for error or logout messages
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) document.getElementById('error-msg').style.display = 'block';
        if (urlParams.has('logout')) document.getElementById('logout-msg').style.display = 'block';
    </script>
</body>
</html>
